
name: Backup Before History Rewrite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Git history backup
        run: |
          git bundle create paper-trail-original.bundle --all
          git bundle verify paper-trail-original.bundle

      - name: Upload original history
        uses: actions/upload-artifact@v4
        with:
          name: paper-trail-original-history
          path: paper-trail-original.bundle
          retention-days: 90
